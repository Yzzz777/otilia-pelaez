<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="900" height="420">
  <defs>
    <!-- Cielo degradado mejorado -->
    <linearGradient id="sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   style="stop-color:#0d2a5e"/>
      <stop offset="45%"  style="stop-color:#1a4a8a"/>
      <stop offset="100%" style="stop-color:#6baed6"/>
    </linearGradient>
    <!-- Pared del edificio -->
    <linearGradient id="wall" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#F2E6CC"/>
      <stop offset="100%" style="stop-color:#DBC99E"/>
    </linearGradient>
    <!-- Pared secundaria -->
    <linearGradient id="wall2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#EDD9B4"/>
      <stop offset="100%" style="stop-color:#CEB890"/>
    </linearGradient>
    <!-- Techo -->
    <linearGradient id="roof" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#B82C2C"/>
      <stop offset="100%" style="stop-color:#8A1A1A"/>
    </linearGradient>
    <!-- Dorado -->
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"  style="stop-color:#FFD700"/>
      <stop offset="50%" style="stop-color:#F5C518"/>
      <stop offset="100%" style="stop-color:#C9A000"/>
    </linearGradient>
    <!-- Overlay oscuro para texto -->
    <linearGradient id="overlay" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   style="stop-color:#071328;stop-opacity:0.25"/>
      <stop offset="60%"  style="stop-color:#071328;stop-opacity:0.55"/>
      <stop offset="100%" style="stop-color:#071328;stop-opacity:0.82"/>
    </linearGradient>
    <!-- Ventana con efecto vidrio -->
    <linearGradient id="glass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"  style="stop-color:#B8D9F0;stop-opacity:0.9"/>
      <stop offset="50%" style="stop-color:#7EC8E3;stop-opacity:0.75"/>
      <stop offset="100%" style="stop-color:#A8C8E8;stop-opacity:0.85"/>
    </linearGradient>
    <!-- Sombra de edificio -->
    <filter id="bldgShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="4" dy="8" stdDeviation="6" flood-color="rgba(0,0,0,0.35)"/>
    </filter>
    <!-- Brillo ventana -->
    <filter id="winGlow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <!-- Textura pared -->
    <pattern id="wallTex" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <rect width="20" height="20" fill="none"/>
      <line x1="0" y1="10" x2="20" y2="10" stroke="rgba(0,0,0,0.04)" stroke-width="0.5"/>
      <line x1="10" y1="0" x2="10" y2="20" stroke="rgba(0,0,0,0.03)" stroke-width="0.5"/>
    </pattern>
    <!-- Glow dorado -->
    <filter id="goldGlow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- == FONDO CIELO == -->
  <rect width="900" height="420" fill="url(#sky)"/>

  <!-- Estrellas / puntos de luz en el cielo nocturno -->
  <circle cx="50"  cy="25" r="1.2" fill="white" opacity="0.7"><animate attributeName="opacity" values="0.7;0.2;0.7" dur="2.3s" repeatCount="indefinite"/></circle>
  <circle cx="120" cy="18" r="0.9" fill="white" opacity="0.5"><animate attributeName="opacity" values="0.5;0.1;0.5" dur="3.1s" repeatCount="indefinite"/></circle>
  <circle cx="200" cy="35" r="1.5" fill="white" opacity="0.6"><animate attributeName="opacity" values="0.6;0.15;0.6" dur="2.7s" repeatCount="indefinite"/></circle>
  <circle cx="340" cy="22" r="1.0" fill="white" opacity="0.45"><animate attributeName="opacity" values="0.45;0.1;0.45" dur="4.2s" repeatCount="indefinite"/></circle>
  <circle cx="560" cy="30" r="1.3" fill="white" opacity="0.6"><animate attributeName="opacity" values="0.6;0.2;0.6" dur="2.1s" repeatCount="indefinite"/></circle>
  <circle cx="700" cy="15" r="1.0" fill="white" opacity="0.5"><animate attributeName="opacity" values="0.5;0.1;0.5" dur="3.6s" repeatCount="indefinite"/></circle>
  <circle cx="800" cy="28" r="1.4" fill="white" opacity="0.65"><animate attributeName="opacity" values="0.65;0.15;0.65" dur="2.9s" repeatCount="indefinite"/></circle>
  <circle cx="850" cy="12" r="0.8" fill="white" opacity="0.4"><animate attributeName="opacity" values="0.4;0.1;0.4" dur="3.8s" repeatCount="indefinite"/></circle>

  <!-- Luna decorativa -->
  <circle cx="820" cy="55" r="28" fill="#E8D98A" opacity="0.9"/>
  <circle cx="832" cy="48" r="24" fill="url(#sky)" opacity="0.92"/>
  <circle cx="820" cy="55" r="28" fill="none" stroke="rgba(232,217,138,0.3)" stroke-width="4"/>

  <!-- Nubes mejoradas con animación -->
  <g opacity="0.85">
    <ellipse cx="110" cy="72" rx="68" ry="28" fill="rgba(200,220,255,0.25)"/>
    <ellipse cx="155" cy="64" rx="55" ry="24" fill="rgba(220,235,255,0.3)"/>
    <ellipse cx="75"  cy="70" rx="38" ry="20" fill="rgba(200,220,255,0.22)"/>
    <animateTransform attributeName="transform" type="translate" values="0,0;8,0;0,0" dur="12s" repeatCount="indefinite"/>
  </g>
  <g opacity="0.7">
    <ellipse cx="680" cy="68" rx="72" ry="26" fill="rgba(200,220,255,0.2)"/>
    <ellipse cx="730" cy="62" rx="58" ry="22" fill="rgba(220,235,255,0.25)"/>
    <animateTransform attributeName="transform" type="translate" values="0,0;-6,0;0,0" dur="15s" repeatCount="indefinite"/>
  </g>

  <!-- == PASTO / TERRENO == -->
  <rect x="0" y="348" width="900" height="72" fill="#3A6B2A"/>
  <rect x="0" y="347" width="900" height="9" fill="#4A8035"/>
  <!-- Textura del pasto -->
  <ellipse cx="50"  cy="349" rx="30" ry="4" fill="rgba(74,128,53,0.5)"/>
  <ellipse cx="200" cy="350" rx="45" ry="4" fill="rgba(74,128,53,0.4)"/>
  <ellipse cx="500" cy="349" rx="60" ry="4" fill="rgba(74,128,53,0.5)"/>
  <ellipse cx="780" cy="349" rx="40" ry="4" fill="rgba(74,128,53,0.4)"/>

  <!-- == EDIFICIO PRINCIPAL == -->
  <!-- Sombra del edificio -->
  <rect x="112" y="168" width="676" height="185" rx="4" fill="rgba(0,0,0,0.3)" transform="translate(8,12)"/>

  <!-- Alas laterales (fondo) -->
  <rect x="112" y="180" width="160" height="168" fill="url(#wall2)" filter="url(#bldgShadow)"/>
  <rect x="112" y="180" width="160" height="168" fill="url(#wallTex)" opacity="0.5"/>

  <rect x="628" y="180" width="160" height="168" fill="url(#wall2)" filter="url(#bldgShadow)"/>
  <rect x="628" y="180" width="160" height="168" fill="url(#wallTex)" opacity="0.5"/>

  <!-- Cuerpo central del edificio -->
  <rect x="272" y="168" width="356" height="180" fill="url(#wall)" filter="url(#bldgShadow)"/>
  <rect x="272" y="168" width="356" height="180" fill="url(#wallTex)" opacity="0.5"/>

  <!-- == TECHOS == -->
  <!-- Techo central (principal) -->
  <polygon points="355,102 545,102 575,168 325,168" fill="url(#roof)"/>
  <!-- Cubierta del techo -->
  <polygon points="352,100 548,100 548,108 352,108" fill="#9B2020"/>
  <!-- Remate dorado del techo -->
  <line x1="352" y1="100" x2="548" y2="100" stroke="url(#gold)" stroke-width="2.5"/>

  <!-- Techo ala izquierda -->
  <polygon points="112,158 276,158 296,180 112,180" fill="url(#roof)" opacity="0.85"/>
  <!-- Techo ala derecha -->
  <polygon points="624,180 788,180 788,158 624,158" fill="url(#roof)" opacity="0.85"/>

  <!-- Cruz / remate del techo central -->
  <rect x="447" y="80" width="6" height="28" rx="2" fill="url(#gold)" filter="url(#goldGlow)"/>
  <rect x="440" y="88" width="20" height="6" rx="2" fill="url(#gold)" filter="url(#goldGlow)"/>
  <!-- Esfera en la cima -->
  <circle cx="450" cy="79" r="6" fill="url(#gold)" filter="url(#goldGlow)"/>
  <circle cx="451" cy="77" r="2" fill="rgba(255,255,220,0.7)"/>

  <!-- Cornisa / moldura superior edificio central -->
  <rect x="272" y="165" width="356" height="7" fill="#C0A870"/>
  <!-- Moldura ala izq -->
  <rect x="112" y="178" width="160" height="5" fill="#B8A060"/>
  <!-- Moldura ala der -->
  <rect x="628" y="178" width="160" height="5" fill="#B8A060"/>

  <!-- Columnas decorativas centrales -->
  <rect x="290" y="180" width="10" height="148" rx="3" fill="#E0C890"/>
  <rect x="396" y="180" width="10" height="148" rx="3" fill="#E0C890"/>
  <rect x="502" y="180" width="10" height="148" rx="3" fill="#E0C890"/>
  <rect x="600" y="180" width="10" height="148" rx="3" fill="#E0C890"/>

  <!-- == VENTANAS — ALA IZQUIERDA == -->
  <!-- Ven 1 izq -->
  <rect x="130" y="200" width="56" height="46" rx="5" fill="url(#glass)" stroke="#C8A870" stroke-width="1.5"/>
  <rect x="130" y="200" width="56" height="46" rx="5" fill="url(#wallTex)" opacity="0.1"/>
  <line x1="158" y1="200" x2="158" y2="246" stroke="rgba(255,255,255,0.5)" stroke-width="1"/>
  <line x1="130" y1="223" x2="186" y2="223" stroke="rgba(255,255,255,0.5)" stroke-width="1"/>
  <rect x="134" y="204" width="18" height="14" rx="2" fill="rgba(255,255,255,0.18)"/>
  <!-- Luz interior parpadeante -->
  <rect x="130" y="200" width="56" height="46" rx="5" fill="rgba(255,240,180,0.08)">
    <animate attributeName="opacity" values="1;0.6;1" dur="4s" repeatCount="indefinite"/>
  </rect>

  <!-- Ven 2 izq -->
  <rect x="210" y="200" width="56" height="46" rx="5" fill="url(#glass)" stroke="#C8A870" stroke-width="1.5"/>
  <line x1="238" y1="200" x2="238" y2="246" stroke="rgba(255,255,255,0.5)" stroke-width="1"/>
  <line x1="210" y1="223" x2="266" y2="223" stroke="rgba(255,255,255,0.5)" stroke-width="1"/>
  <rect x="214" y="204" width="18" height="14" rx="2" fill="rgba(255,255,255,0.18)"/>

  <!-- Ventanas 2da fila ala izq -->
  <rect x="130" y="268" width="56" height="40" rx="5" fill="url(#glass)" stroke="#C8A870" stroke-width="1.5" opacity="0.85"/>
  <rect x="210" y="268" width="56" height="40" rx="5" fill="url(#glass)" stroke="#C8A870" stroke-width="1.5" opacity="0.85"/>

  <!-- == VENTANAS — CUERPO CENTRAL == -->
  <!-- Ventanas superiores centrales con arco -->
  <!-- Ventana arco izq -->
  <rect x="295" y="192" width="62" height="68" rx="5" fill="url(#glass)" stroke="#C8A870" stroke-width="2"/>
  <rect x="295" y="192" width="62" height="20" rx="5" fill="rgba(255,240,200,0.15)"/>
  <path d="M295 210 Q326 185 357 210" fill="url(#glass)" stroke="#C8A870" stroke-width="1.5"/>
  <line x1="326" y1="195" x2="326" y2="260" stroke="rgba(255,255,255,0.45)" stroke-width="1.2"/>
  <line x1="295" y1="228" x2="357" y2="228" stroke="rgba(255,255,255,0.45)" stroke-width="1.2"/>
  <rect x="299" y="195" width="22" height="16" rx="2" fill="rgba(255,255,255,0.22)"/>

  <!-- Ventana arco central (con cruz) -->
  <rect x="383" y="188" width="68" height="72" rx="5" fill="url(#glass)" stroke="#C8A870" stroke-width="2" filter="url(#winGlow)"/>
  <path d="M383 208 Q417 180 451 208" fill="rgba(255,240,200,0.2)" stroke="#C8A870" stroke-width="1.5"/>
  <line x1="417" y1="192" x2="417" y2="260" stroke="rgba(255,255,255,0.6)" stroke-width="1.5"/>
  <line x1="383" y1="230" x2="451" y2="230" stroke="rgba(255,255,255,0.6)" stroke-width="1.5"/>
  <!-- Brillo ventana central -->
  <rect x="387" y="193" width="25" height="18" rx="3" fill="rgba(255,255,255,0.25)"/>
  <rect x="383" y="188" width="68" height="72" rx="5" fill="rgba(255,248,180,0.06)">
    <animate attributeName="fill-opacity" values="0.06;0.14;0.06" dur="6s" repeatCount="indefinite"/>
  </rect>

  <!-- Ventana arco der -->
  <rect x="477" y="192" width="62" height="68" rx="5" fill="url(#glass)" stroke="#C8A870" stroke-width="2"/>
  <rect x="477" y="192" width="62" height="20" rx="5" fill="rgba(255,240,200,0.15)"/>
  <path d="M477 210 Q508 185 539 210" fill="url(#glass)" stroke="#C8A870" stroke-width="1.5"/>
  <line x1="508" y1="195" x2="508" y2="260" stroke="rgba(255,255,255,0.45)" stroke-width="1.2"/>
  <line x1="477" y1="228" x2="539" y2="228" stroke="rgba(255,255,255,0.45)" stroke-width="1.2"/>
  <rect x="481" y="195" width="22" height="16" rx="2" fill="rgba(255,255,255,0.22)"/>

  <!-- Ventanas 2da fila central -->
  <rect x="295" y="278" width="56" height="40" rx="4" fill="url(#glass)" stroke="#C8A870" stroke-width="1.5"/>
  <line x1="323" y1="278" x2="323" y2="318" stroke="rgba(255,255,255,0.4)" stroke-width="1"/>
  <rect x="385" y="278" width="64" height="40" rx="4" fill="url(#glass)" stroke="#C8A870" stroke-width="1.5"/>
  <line x1="417" y1="278" x2="417" y2="318" stroke="rgba(255,255,255,0.4)" stroke-width="1"/>
  <rect x="483" y="278" width="56" height="40" rx="4" fill="url(#glass)" stroke="#C8A870" stroke-width="1.5"/>
  <line x1="511" y1="278" x2="511" y2="318" stroke="rgba(255,255,255,0.4)" stroke-width="1"/>

  <!-- == VENTANAS — ALA DERECHA == -->
  <rect x="648" y="200" width="56" height="46" rx="5" fill="url(#glass)" stroke="#C8A870" stroke-width="1.5"/>
  <line x1="676" y1="200" x2="676" y2="246" stroke="rgba(255,255,255,0.5)" stroke-width="1"/>
  <line x1="648" y1="223" x2="704" y2="223" stroke="rgba(255,255,255,0.5)" stroke-width="1"/>
  <rect x="652" y="204" width="18" height="14" rx="2" fill="rgba(255,255,255,0.18)"/>

  <rect x="724" y="200" width="56" height="46" rx="5" fill="url(#glass)" stroke="#C8A870" stroke-width="1.5"/>
  <line x1="752" y1="200" x2="752" y2="246" stroke="rgba(255,255,255,0.5)" stroke-width="1"/>
  <line x1="724" y1="223" x2="780" y2="223" stroke="rgba(255,255,255,0.5)" stroke-width="1"/>
  <rect x="728" y="204" width="18" height="14" rx="2" fill="rgba(255,255,255,0.18)"/>

  <rect x="648" y="268" width="56" height="40" rx="5" fill="url(#glass)" stroke="#C8A870" stroke-width="1.5" opacity="0.85"/>
  <rect x="724" y="268" width="56" height="40" rx="5" fill="url(#glass)" stroke="#C8A870" stroke-width="1.5" opacity="0.85"/>

  <!-- == PUERTA PRINCIPAL == -->
  <!-- Marco de la puerta -->
  <rect x="384" y="300" width="116" height="48" rx="4" fill="#7B5A1A"/>
  <!-- Arco de medio punto sobre la puerta -->
  <path d="M384 316 Q442 280 500 316" fill="#7B5A1A" stroke="#C9A000" stroke-width="2.5"/>
  <!-- Hojas de la puerta -->
  <rect x="388" y="304" width="50" height="44" rx="3" fill="#9B7A28"/>
  <rect x="444" y="304" width="50" height="44" rx="3" fill="#9B7A28"/>
  <!-- Paneles decorativos de la puerta -->
  <rect x="392" y="308" width="20" height="16" rx="2" fill="#B8901C" opacity="0.6"/>
  <rect x="418" y="308" width="16" height="16" rx="2" fill="#B8901C" opacity="0.6"/>
  <rect x="448" y="308" width="16" height="16" rx="2" fill="#B8901C" opacity="0.6"/>
  <rect x="470" y="308" width="20" height="16" rx="2" fill="#B8901C" opacity="0.6"/>
  <rect x="392" y="330" width="20" height="14" rx="2" fill="#B8901C" opacity="0.6"/>
  <rect x="470" y="330" width="20" height="14" rx="2" fill="#B8901C" opacity="0.6"/>
  <!-- Manija dorada -->
  <circle cx="438" cy="328" r="5" fill="url(#gold)" filter="url(#goldGlow)"/>
  <circle cx="452" cy="328" r="5" fill="url(#gold)" filter="url(#goldGlow)"/>
  <!-- Cerrojo central -->
  <rect x="440" y="322" width="10" height="12" rx="3" fill="url(#gold)"/>
  <!-- Brillo de la puerta -->
  <rect x="384" y="300" width="116" height="48" rx="4" fill="rgba(255,255,255,0.04)"/>

  <!-- Escalones de la entrada -->
  <rect x="358" y="346" width="184" height="6" rx="2" fill="#C8A870"/>
  <rect x="370" y="340" width="160" height="6" rx="2" fill="#D4BC90"/>
  <rect x="384" y="334" width="132" height="6" rx="2" fill="#DCC8A0"/>

  <!-- == BANDERA DOMINICANA == -->
  <rect x="441" y="104" width="3"  height="48" fill="#6B6B6B"/>
  <rect x="444" y="104" width="22" height="12" fill="#002D62"/>
  <rect x="444" y="116" width="22" height="12" fill="#CF142B"/>
  <rect x="444" y="104" width="5"  height="24" fill="white"/>
  <circle cx="449" cy="103" r="3" fill="#F5C518"/>

  <!-- == ÁRBOLES DECORATIVOS == -->
  <!-- Árbol izquierdo -->
  <rect x="68"  y="306" width="10" height="42" fill="#5C3A1A"/>
  <ellipse cx="73" cy="295" rx="30" ry="38" fill="#2E7D32"/>
  <ellipse cx="62" cy="282" rx="22" ry="30" fill="#388E3C"/>
  <ellipse cx="82" cy="286" rx="20" ry="28" fill="#33821A"/>
  <!-- Árbol derecho -->
  <rect x="824" y="306" width="10" height="42" fill="#5C3A1A"/>
  <ellipse cx="829" cy="295" rx="30" ry="38" fill="#2E7D32"/>
  <ellipse cx="818" cy="286" rx="20" ry="28" fill="#33821A"/>
  <ellipse cx="840" cy="282" rx="22" ry="30" fill="#388E3C"/>

  <!-- Arbustos al frente -->
  <ellipse cx="160" cy="348" rx="42" ry="14" fill="#276020" opacity="0.9"/>
  <ellipse cx="740" cy="348" rx="42" ry="14" fill="#276020" opacity="0.9"/>
  <ellipse cx="318" cy="348" rx="28" ry="10" fill="#2E7024" opacity="0.8"/>
  <ellipse cx="582" cy="348" rx="28" ry="10" fill="#2E7024" opacity="0.8"/>

  <!-- Sendero de entrada -->
  <path d="M370,420 Q420,370 430,348 L460,348 Q470,370 520,420Z" fill="#BDA870" opacity="0.6"/>

  <!-- Farolas decorativas -->
  <g transform="translate(310,295)">
    <rect x="-2" y="0" width="4" height="55" fill="#888"/>
    <ellipse cx="0" cy="0" rx="12" ry="6" fill="#AAA"/>
    <ellipse cx="0" cy="-3" rx="8" ry="4" fill="#FFE88A" opacity="0.85">
      <animate attributeName="opacity" values="0.85;0.5;0.85" dur="3s" repeatCount="indefinite"/>
    </ellipse>
    <line x1="0" y1="0" x2="0" y2="-3" stroke="#AAA" stroke-width="1.5"/>
  </g>
  <g transform="translate(590,295)">
    <rect x="-2" y="0" width="4" height="55" fill="#888"/>
    <ellipse cx="0" cy="0" rx="12" ry="6" fill="#AAA"/>
    <ellipse cx="0" cy="-3" rx="8" ry="4" fill="#FFE88A" opacity="0.85">
      <animate attributeName="opacity" values="0.85;0.5;0.85" dur="3.5s" repeatCount="indefinite"/>
    </ellipse>
  </g>

  <!-- == OVERLAY PARA TEXTO == -->
  <rect width="900" height="420" fill="url(#overlay)"/>

  <!-- == TEXTO PRINCIPAL == -->
  <!-- Líneas decorativas laterales -->
  <line x1="80"  y1="238" x2="320" y2="238" stroke="url(#gold)" stroke-width="1.5" opacity="0.7"/>
  <line x1="580" y1="238" x2="820" y2="238" stroke="url(#gold)" stroke-width="1.5" opacity="0.7"/>
  <circle cx="80"  cy="238" r="3" fill="url(#gold)" opacity="0.8"/>
  <circle cx="820" cy="238" r="3" fill="url(#gold)" opacity="0.8"/>

  <!-- Subtítulo superior -->
  <text x="450" y="218" font-family="Georgia, serif" font-size="11" font-weight="400"
        fill="rgba(212,175,55,0.85)" text-anchor="middle" letter-spacing="4">
    MINERD · DISTRITO 10-02
  </text>

  <!-- Título principal -->
  <text x="450" y="254" font-family="Georgia, 'Playfair Display', serif" font-size="34"
        font-weight="bold" fill="#FFFFFF" text-anchor="middle"
        style="text-shadow:0 2px 12px rgba(0,0,0,0.8)">
    Centro Educativo
  </text>
  <text x="450" y="296" font-family="Georgia, 'Playfair Display', serif" font-size="46"
        font-weight="bold" fill="url(#gold)" text-anchor="middle" filter="url(#goldGlow)">
    Otilia Peláez
  </text>

  <!-- Línea divisora -->
  <rect x="300" y="308" width="300" height="1.5" rx="1" fill="url(#gold)" opacity="0.6"/>

  <!-- Texto inferior -->
  <text x="450" y="326" font-family="Georgia, serif" font-size="11.5"
        fill="rgba(255,255,255,0.75)" text-anchor="middle" letter-spacing="2.5">
    SABANA PERDIDA · SANTO DOMINGO NORTE · RD
  </text>
  <text x="450" y="345" font-family="Georgia, serif" font-size="10"
