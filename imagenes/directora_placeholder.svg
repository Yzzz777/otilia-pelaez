<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="320" height="320">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="60%">
      <stop offset="0%" style="stop-color:#1a2f5c"/>
      <stop offset="100%" style="stop-color:#071328"/>
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700"/>
      <stop offset="40%" style="stop-color:#F5C518"/>
      <stop offset="100%" style="stop-color:#C9A000"/>
    </linearGradient>
    <linearGradient id="habitoGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FAFAFA"/>
      <stop offset="100%" style="stop-color:#E8E8E8"/>
    </linearGradient>
    <linearGradient id="skinGrad" cx="50%" cy="50%" r="50%"
      x1="30%" y1="20%" x2="70%" y2="80%" gradientUnits="userSpaceOnUse">
      <stop offset="0%" style="stop-color:#F8C89A"/>
      <stop offset="100%" style="stop-color:#E8A87C"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="rgba(0,0,0,0.35)"/>
    </filter>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="circle-clip">
      <circle cx="160" cy="160" r="155"/>
    </clipPath>
    <!-- Patrón de fondo sutil -->
    <pattern id="dots" x="0" y="0" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="8" cy="8" r="1" fill="rgba(212,175,55,0.08)"/>
    </pattern>
  </defs>

  <!-- Fondo -->
  <circle cx="160" cy="160" r="160" fill="url(#bgGrad)"/>
  <circle cx="160" cy="160" r="160" fill="url(#dots)"/>

  <!-- Anillos decorativos -->
  <circle cx="160" cy="160" r="153" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" opacity="0.6"/>
  <circle cx="160" cy="160" r="145" fill="none" stroke="rgba(212,175,55,0.15)" stroke-width="1"/>

  <!-- Luz superior sutil -->
  <ellipse cx="160" cy="90" rx="80" ry="60" fill="rgba(255,255,255,0.04)"/>

  <g clip-path="url(#circle-clip)">
    <!-- Hábito / vestimenta religiosa — cuerpo completo -->
    <ellipse cx="160" cy="380" rx="110" ry="70" fill="url(#habitoGrad)" filter="url(#softShadow)"/>
    <rect x="75" y="235" width="170" height="160" rx="8" fill="url(#habitoGrad)" filter="url(#softShadow)"/>
    <!-- Pliegues del hábito -->
    <line x1="140" y1="245" x2="135" y2="395" stroke="rgba(0,0,0,0.07)" stroke-width="1.5"/>
    <line x1="160" y1="242" x2="160" y2="395" stroke="rgba(0,0,0,0.06)" stroke-width="1.5"/>
    <line x1="180" y1="245" x2="185" y2="395" stroke="rgba(0,0,0,0.07)" stroke-width="1.5"/>

    <!-- Velo negro (toca) -->
    <ellipse cx="160" cy="180" rx="82" ry="98" fill="#1A1A1A"/>
    <!-- Toca blanca interior -->
    <ellipse cx="160" cy="185" rx="63" ry="79" fill="#FFFFFF"/>
    <!-- Banda de la toca -->
    <rect x="97" y="215" width="126" height="16" rx="2" fill="#E8E8E8"/>
    <rect x="97" y="215" width="126" height="3" rx="1" fill="#d0d0d0"/>

    <!-- CARA -->
    <ellipse cx="160" cy="173" rx="47" ry="56" fill="url(#skinGrad)" filter="url(#softShadow)"/>

    <!-- Sombra bajo la barbilla -->
    <ellipse cx="160" cy="222" rx="38" ry="6" fill="rgba(0,0,0,0.12)"/>

    <!-- Cejas — expresivas y bien definidas -->
    <path d="M130 148 Q143 142 154 147" stroke="#5C3D2A" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <path d="M166 147 Q177 142 190 148" stroke="#5C3D2A" stroke-width="2.5" fill="none" stroke-linecap="round"/>

    <!-- Ojos — más grandes y expresivos -->
    <!-- Sombra párpado -->
    <ellipse cx="142" cy="163" rx="12" ry="5" fill="rgba(92,61,42,0.15)"/>
    <ellipse cx="178" cy="163" rx="12" ry="5" fill="rgba(92,61,42,0.15)"/>
    <!-- Iris -->
    <ellipse cx="142" cy="165" rx="9" ry="10" fill="#3D2B1A"/>
    <ellipse cx="178" cy="165" rx="9" ry="10" fill="#3D2B1A"/>
    <!-- Pupila -->
    <ellipse cx="142" cy="165" rx="5.5" ry="6.5" fill="#1A0D06"/>
    <ellipse cx="178" cy="165" rx="5.5" ry="6.5" fill="#1A0D06"/>
    <!-- Brillo -->
    <circle cx="145" cy="161" r="2.5" fill="white" opacity="0.85"/>
    <circle cx="181" cy="161" r="2.5" fill="white" opacity="0.85"/>
    <circle cx="143" cy="163" r="1" fill="white" opacity="0.4"/>
    <circle cx="179" cy="163" r="1" fill="white" opacity="0.4"/>
    <!-- Párpado superior -->
    <path d="M133 161 Q142 155 151 161" stroke="#2C1A0E" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    <path d="M169 161 Q178 155 187 161" stroke="#2C1A0E" stroke-width="1.5" fill="none" stroke-linecap="round"/>

    <!-- Nariz -->
    <path d="M158 178 Q154 190 150 195 Q160 199 170 195 Q166 190 162 178Z" fill="rgba(180,110,70,0.35)"/>
    <ellipse cx="152" cy="194" rx="5" ry="3.5" fill="rgba(180,110,70,0.25)"/>
    <ellipse cx="168" cy="194" rx="5" ry="3.5" fill="rgba(180,110,70,0.25)"/>

    <!-- Boca — sonrisa suave y amigable -->
    <path d="M144 207 Q160 218 176 207" stroke="#B56C50" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <!-- Labio superior -->
    <path d="M146 205 Q153 201 160 205 Q167 201 174 205" stroke="#C47A5A" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    <!-- Mejillas con sonrojo sutil -->
    <ellipse cx="126" cy="195" rx="14" ry="8" fill="rgba(220,130,110,0.12)"/>
    <ellipse cx="194" cy="195" rx="14" ry="8" fill="rgba(220,130,110,0.12)"/>

    <!-- Cruz en el hábito — más elegante -->
    <rect x="150" y="248" width="20" height="58" rx="4" fill="url(#goldGrad)" opacity="0.9" filter="url(#glow)"/>
    <rect x="136" y="268" width="48" height="16" rx="4" fill="url(#goldGrad)" opacity="0.9" filter="url(#glow)"/>
    <!-- Brillo de la cruz -->
    <rect x="152" y="250" width="6" height="10" rx="2" fill="rgba(255,255,255,0.4)"/>

    <!-- Banda de texto en el fondo -->
    <rect x="0" y="272" width="320" height="50" fill="rgba(7,19,40,0.82)"/>
  </g>

  <!-- Borde exterior dorado elegante -->
  <circle cx="160" cy="160" r="155" fill="none" stroke="url(#goldGrad)" stroke-width="4" filter="url(#glow)"/>
  <circle cx="160" cy="160" r="151" fill="none" stroke="rgba(255,248,180,0.25)" stroke-width="1"/>

  <!-- Texto -->
  <text x="160" y="299" font-family="Georgia, 'Playfair Display', serif" font-size="12.5"
        font-weight="bold" fill="#FFE88A" text-anchor="middle" letter-spacing="0.5">
    Sor Cesarina A. Paulino
  </text>
  <text x="160" y="314" font-family="Georgia, serif" font-size="10.5"
        fill="rgba(212,175,55,0.9)" text-anchor="middle" letter-spacing="0.3">
    Directora Docente
  </text>

  <!-- Puntos decorativos superiores -->
  <circle cx="90"  cy="44" r="2" fill="rgba(212,175,55,0.4)"/>
  <circle cx="160" cy="10" r="2" fill="rgba(212,175,55,0.5)"/>
  <circle cx="230" cy="44" r="2" fill="rgba(212,175,55,0.4)"/>
</svg>
